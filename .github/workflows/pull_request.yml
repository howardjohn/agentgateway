name: Branch

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  # GitHub concurrency keeps at most one running and one pending run per group.
  # Use ref_name for PRs so new commits cancel older PR runs on the same PR,
  # but key pushes by SHA so postsubmit runs do not cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref_name) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CI: true
  RUST_VERSION: "1.97.0"
  CARGO_BUILD_WARNINGS: deny
  GO_VERSION: "1.26.4"

jobs:
  controller-e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        # git-restore-mtime needs full history to find each file's latest change.
        fetch-depth: 0
    - name: Check Runner Info
      run: |
        cat /sys/fs/cgroup/cpu.stat || true
        cat /proc/pressure/cpu || true
        lscpu || true
        openssl speed -seconds 1 -bytes 256 sha256 || true
    - name: Install Rust
      uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
      with:
        toolchain: "${{ env.RUST_VERSION }}"
    - name: Restore source mtimes
      run: ./tools/git-restore-mtime --commit-time
    # rust-cache includes nested .cargo/config.toml files in its exact cache key,
    # but not in its fallback restore prefix. Keying this synthetic config by the
    # crates/ Git tree makes Rust input changes update the cache, while changes
    # elsewhere can exactly reuse it without another cache write.
    - name: Set Rust cache generation
      id: rust-cache-generation
      run: |
        mkdir -p .github/rust-cache/.cargo .github/rust-cache-state

        crates_generation="$(git rev-parse HEAD:crates)"
        proto_generation="$(git rev-parse HEAD:crates/protos/proto)-$(git rev-parse HEAD:crates/protos/build.rs)"

        printf '# generation = %s\n' "$crates_generation" > .github/rust-cache/.cargo/config.toml
        echo "protos=$proto_generation" >> "$GITHUB_OUTPUT"
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        # Workspace artifacts are cheap to cache and can avoid rebuilding when Rust
        # inputs have not changed. Fallback restores remain best-effort because their
        # prefix deliberately excludes the source generation above.
        cache-workspace-crates: true
        # Remember which proto inputs produced the cached build-script output. This
        # lets us retain the fallback's dependencies while rejecting stale generated
        # Rust when the proto inputs changed.
        cache-directories: .github/rust-cache-state
        # Github cache will restore from 'main' OR the current branch.
        # If we cache PR branches, we may evict the 'main' cache and end up with no cache hits at all.
        # Ideally, we would have main be 'high priority' and not be evicted but I don't think thats possible.
        save-if: ${{ github.ref == 'refs/heads/main' }}
    # Cargo's build-script invalidation compares mtimes. A fallback cache can contain
    # old generated protos with a newer mtime than the source restored from Git, making
    # Cargo incorrectly skip build.rs. Force regeneration only when the cached proto
    # generation differs, then persist the current generation with the next cache.
    - name: Validate cached Rust proto generation
      env:
        CURRENT_PROTOS: ${{ steps.rust-cache-generation.outputs.protos }}
      run: |
        cached_protos="$(cat .github/rust-cache-state/protos 2>/dev/null || true)"

        echo "Cached proto generation: ${cached_protos:-missing}"
        echo "Current proto generation: $CURRENT_PROTOS"

        if [[ "$cached_protos" != "$CURRENT_PROTOS" ]]; then
          echo "Proto inputs changed; forcing crates/protos/build.rs to rerun"
          touch crates/protos/build.rs
        fi

        printf '%s\n' "$CURRENT_PROTOS" > .github/rust-cache-state/protos
    - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version: "${{ env.GO_VERSION }}"
        # setup-go's immutable dependency-only key can leave GOCACHE stale forever.
        # Restore and save the module and build caches separately below instead.
        cache: false
    - name: Set Go cache keys
      id: go-cache-keys
      run: |
        {
          echo "build=$(go env GOCACHE)"
          echo "modules=$(go env GOMODCACHE)"
          # The controller imports the local api/ module, so both trees are build inputs.
          echo "source=$(git rev-parse HEAD:controller)-$(git rev-parse HEAD:api)"
        } >> "$GITHUB_OUTPUT"
    - name: Show Go cache configuration
      run: |
        echo "Go version: $(go env GOVERSION)"
        echo "Module cache: ${{ steps.go-cache-keys.outputs.modules }}"
        echo "Build cache: ${{ steps.go-cache-keys.outputs.build }}"
        echo "Dependency hash: ${{ hashFiles('**/go.mod', '**/go.sum') }}"
        echo "Controller/API trees: ${{ steps.go-cache-keys.outputs.source }}"
    # Module downloads are independent of source. An exact dependency match is
    # preferred, while the prefix can still reuse unchanged modules after go.sum changes.
    - name: Restore Go module cache
      id: go-module-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.go-cache-keys.outputs.modules }}
        key: go-mod-v0-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
        restore-keys: |
          go-mod-v0-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
    # The controller/API trees make source changes produce a new exact key. Restore
    # prefixes seed that build from the newest compatible cache instead of starting
    # cold; non-controller changes retain the exact key and avoid another cache save.
    - name: Restore Go build cache
      id: go-build-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.go-cache-keys.outputs.build }}
        key: go-build-controller-e2e-v0-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('**/go.mod', '**/go.sum') }}-${{ steps.go-cache-keys.outputs.source }}
        restore-keys: |
          go-build-controller-e2e-v0-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('**/go.mod', '**/go.sum') }}-
          go-build-controller-e2e-v0-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
    - name: Show Go cache restore results
      run: |
        echo "Module exact hit: ${{ steps.go-module-cache.outputs.cache-hit }}"
        echo "Module matched key: ${{ steps.go-module-cache.outputs.cache-matched-key }}"
        echo "Build exact hit: ${{ steps.go-build-cache.outputs.cache-hit }}"
        echo "Build matched key: ${{ steps.go-build-cache.outputs.cache-matched-key }}"
        du -sh "${{ steps.go-cache-keys.outputs.modules }}" "${{ steps.go-cache-keys.outputs.build }}" 2>/dev/null || true
    - name: Set Path
      run: |
        echo "./tools" >> "$GITHUB_PATH"
    - name: Setup
      run: TEST_MODE=e2e ./controller/test/setup/setup-kind-ci.sh
    - name: E2E
      run: |
        CGO_ENABLED=0 PERSIST_INSTALL=true go test -tags=e2e -v ./controller/test/e2e
    - name: Show populated Go cache sizes
      run: |
        du -sh "${{ steps.go-cache-keys.outputs.modules }}" "${{ steps.go-cache-keys.outputs.build }}" 2>/dev/null || true
    # PRs restore the default branch caches but never publish their own. Successful
    # main builds roll each cache forward only when its exact input key was absent.
    - name: Save Go module cache
      if: ${{ github.ref == 'refs/heads/main' && steps.go-module-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.go-cache-keys.outputs.modules }}
        key: ${{ steps.go-module-cache.outputs.cache-primary-key }}
    - name: Save Go build cache
      if: ${{ github.ref == 'refs/heads/main' && steps.go-build-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.go-cache-keys.outputs.build }}
        key: ${{ steps.go-build-cache.outputs.cache-primary-key }}
    - name: Archive bug report directory on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: bug-report
        path: ./controller/_test/bug_report/kind
        retention-days: 2
    - name: Upload cargo timings
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: cargo-timings-e2e
        path: target/cargo-timings/cargo-timing*.html
        retention-days: 2
    - name: Summary
      run: |
        printf '# E2E Timings\n'
        cat controller/_test/ci-step-timings.log >> "$GITHUB_STEP_SUMMARY"
